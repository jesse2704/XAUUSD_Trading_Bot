[tool.poetry]
name = "xauusd-trading-bot"
version = "1.0.0"
description = "Professional XAUUSD (Gold) Trading Bot for Trading212 with top 5 algorithmic trading strategies"
authors = ["Trading Bot Developer"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.1.0"
numpy = "^1.26.0"
ta = "^0.11.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
schedule = "^1.2.0"
websocket-client = "^1.6.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
responses = "^0.24.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "config"]
omit = ["tests/*", "scripts/*", "backtest/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
